<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            color: #22313f;
            background: #eef4f8;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
        }

        .page {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border: 1px solid #d9e4ea;
            border-radius: 8px;
            padding: 32px;
            box-shadow: 0 12px 32px rgba(34, 49, 63, 0.12);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
            line-height: 1.2;
        }

        .intro {
            margin: 0 0 24px;
            color: #637381;
            line-height: 1.5;
        }

        .success {
            margin: 0 0 20px;
            padding: 12px 14px;
            color: #0f5132;
            background: #dff5e8;
            border: 1px solid #b8e4c8;
            border-radius: 6px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 700;
            color: #2f4050;
        }

        input {
            width: 100%;
            min-height: 44px;
            padding: 10px 12px;
            border: 1px solid #b8c7d1;
            border-radius: 6px;
            color: #22313f;
            font: inherit;
            background: #ffffff;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
        }

        .errorlist {
            margin: 8px 0 0;
            padding: 0;
            list-style: none;
            color: #b42318;
            font-size: 14px;
            line-height: 1.4;
        }

        button {
            width: 100%;
            min-height: 46px;
            margin-top: 6px;
            border: 0;
            border-radius: 6px;
            color: #ffffff;
            background: #2563eb;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        @media (max-width: 520px) {
            .page {
                padding: 24px 18px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <h1>Event Registration</h1>
        <p class="intro">Fill out the form below to reserve your spot.</p>

        {% if success_message %}
            <p class="success">{{ success_message }}</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            {% for field in form %}
                <div class="field">
                    {{ field.label_tag }}
                    {{ field }}
                    {{ field.errors }}
                </div>
            {% endfor %}

            <button type="submit">Register</button>
        </form>
    </main>
</body>
</html>
